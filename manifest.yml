//ghjgkj
modules:
  jira:issuePanel:
    - key: testcase-deepak-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: TestCase-Deepak_New
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/a9a54f70-77e9-45d5-b57a-e9e39b1718cb
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: api.openai.com
